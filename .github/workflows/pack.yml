name: Daily Prerelease (if new commits)

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check
        run: |
          current_sha=$(git rev-parse HEAD)
          echo "current_sha=$current_sha" >> $GITHUB_OUTPUT
          if git rev-parse prerelease >/dev/null 2>&1; then
            prerelease_sha=$(git rev-parse prerelease)
            echo "prerelease_sha=$prerelease_sha" >> $GITHUB_OUTPUT
            if [ "$current_sha" = "$prerelease_sha" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "prerelease_sha=" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if no new commits
        if: steps.check.outputs.skip == 'true'
        run: echo "没有新提交，跳过打包和发布。"

      - name: Setup Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Run pack script
        if: steps.check.outputs.skip != 'true'
        run: python pack.py

      - name: Get version
        if: steps.check.outputs.skip != 'true'
        id: get_version
        run: |
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('defines.yml'))['VERSION'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create/Update Prerelease
        if: steps.check.outputs.skip != 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "output/Age-${{ steps.get_version.outputs.version }}.zip"
          tag: "prerelease"
          name: "Pre-release v${{ steps.get_version.outputs.version }}"
          body: |
            ## 每日预发布版本（自动构建）
            - 版本: ${{ steps.get_version.outputs.version }}
            - 提交: ${{ github.sha }}
            - 触发: ${{ github.event_name == 'schedule' && '定时构建' || '手动触发' }}
          prerelease: true
          allowUpdates: true
          updateOnlyUnreleased: false
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
