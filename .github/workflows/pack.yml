name: "打包并自动发布Release"

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check
        run: |
          current_sha=$(git rev-parse HEAD)
          echo "current_sha=$current_sha" >> $GITHUB_OUTPUT
          if git rev-parse prerelease >/dev/null 2>&1; then
            prerelease_sha=$(git rev-parse prerelease)
            echo "prerelease_sha=$prerelease_sha" >> $GITHUB_OUTPUT
            if [ "$current_sha" = "$prerelease_sha" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "prerelease_sha=" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Run pack script
        if: steps.check.outputs.skip != 'true'
        run: python pack.py

      - name: Get version
        if: steps.check.outputs.skip != 'true'
        id: get_version
        run: |
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('defines.yml'))['VERSION'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ----- 新增：判断版本是否已发布 -----
      - name: Check if version already released
        if: steps.check.outputs.skip != 'true'
        id: check_version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG="pre-release-${VERSION}"
          # 检查该 tag 是否已经存在
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ----- 创建/更新 Pre-release -----
      - name: Create/Update Prerelease
        if: steps.check.outputs.skip != 'true'
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "output/Age-${{ steps.get_version.outputs.version }}.zip"
          # 如果该版本已存在，则使用带版本号的 tag；否则使用固定的 prerelease tag
          tag: ${{ steps.check_version.outputs.exists == 'true' && format('pre-release-{0}', steps.get_version.outputs.version) || 'prerelease' }}
          name: ${{ steps.check_version.outputs.exists == 'true' && format('Pre-release v{0}', steps.get_version.outputs.version) || 'Pre-release (latest)' }}
          body: |
            ## 每日预发布版本（自动构建）
            - 版本: ${{ steps.get_version.outputs.version }}
            - 提交: ${{ github.sha }}
            - 触发: ${{ github.event_name == 'schedule' && '定时构建' || '手动触发' }}
          prerelease: true
          allowUpdates: true
          updateOnlyUnreleased: false
          makeLatest: ${{ steps.check_version.outputs.exists == 'true' && 'true' || 'false' }}   # 如果版本已存在，设为最新
          token: ${{ secrets.GITHUB_TOKEN }}