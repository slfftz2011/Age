name: 每日构建与发布

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:        # 保留手动触发

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.set_tag.outputs.tag }}
      hotfix_suffix: ${{ steps.set_tag.outputs.hotfix_suffix }}
      asset_name: ${{ steps.set_asset_name.outputs.asset_name }}
      release_body: ${{ steps.build_body.outputs.release_body }}
      check_output: ${{ steps.run_check.outputs.check_output }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML nbtlib

      - name: 获取版本号
        id: get_version
        run: |
          VERSION=$(python -c "import yaml; print(yaml.safe_load(open('defines.yml'))['VERSION'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 设置标签和后缀
        id: set_tag
        run: |
          TAG="v${{ env.VERSION }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "hotfix_suffix=-hotfix-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          else
            echo "hotfix_suffix=" >> $GITHUB_OUTPUT
          fi

      - name: 设置资产名称
        id: set_asset_name
        run: |
          SUFFIX="${{ steps.set_tag.outputs.hotfix_suffix }}"
          ASSET="Age-${{ env.VERSION }}${SUFFIX}.zip"
          echo "asset_name=$ASSET" >> $GITHUB_OUTPUT

      - name: 运行综合检查（不中断构建）
        id: run_check
        continue-on-error: true
        run: |
          python check_all.py 2>&1 | tee check_output.txt
          echo "check_output<<EOF" >> $GITHUB_OUTPUT
          cat check_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 打包数据包
        run: python pack.py

      - name: 构建 Release 正文
        id: build_body
        run: |
          BODY="## 数据包版本 ${{ env.VERSION }}"
          BODY+="\n\n### 检查结果\n\`\`\`\n${{ steps.run_check.outputs.check_output }}\n\`\`\`"
          echo "release_body=$BODY" >> $GITHUB_OUTPUT

      - name: 创建/更新 Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "output/${{ steps.set_asset_name.outputs.asset_name }}"
          tag: ${{ steps.set_tag.outputs.tag }}
          name: "数据包 ${{ env.VERSION }}"
          body: ${{ steps.build_body.outputs.release_body }}
          prerelease: true
          allowUpdates: true
          updateOnlyUnreleased: false
          makeLatest: ${{ steps.set_tag.outputs.hotfix_suffix == '' }}
          token: ${{ secrets.GITHUB_TOKEN }}