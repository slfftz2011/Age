name: 生成热源/冷源检测函数

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: 运行热源/冷源生成脚本
        run: python data/age/python/temperature/hot_cold.py

      - name: 复制产物
        run: cp data/age/functions/state/temperature/hot_cold.mcfunction hot_cold.mcfunction

      - name: 发布至 dict Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: hot_cold.mcfunction
          tag: dict
          name: "热源/冷源检测函数"
          body: |
            手动触发生成的 `hot_cold.mcfunction` 文件。
            生成时间: ${{ github.event.head_commit.timestamp }}
            提交: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          allowUpdates: true
          updateOnlyUnreleased: false
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}